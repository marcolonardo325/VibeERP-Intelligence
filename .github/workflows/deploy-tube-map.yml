name: Build & Deploy Live Tube Map → Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'live_tube_server.py'
      - 'live_map.html'
      - 'vehicle_assets.json'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/deploy-tube-map.yml'
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}                 # e.g. marcotubeacr
  RESOURCE_GROUP: ${{ secrets.AZURE_RG }}           # e.g. vibeconf-rg
  CONTAINER_APP: ${{ secrets.CONTAINER_APP_NAME }}  # e.g. tube-map
  IMAGE: live-tube-map

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name $ACR_NAME

      - name: Build & push image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ACR_NAME.azurecr.io/$IMAGE:$IMAGE_TAG -t $ACR_NAME.azurecr.io/$IMAGE:latest .
          docker push $ACR_NAME.azurecr.io/$IMAGE:$IMAGE_TAG
          docker push $ACR_NAME.azurecr.io/$IMAGE:latest

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}

      - name: Show app URL
        run: |
          FQDN=$(az containerapp show -n $CONTAINER_APP -g $RESOURCE_GROUP --query properties.configuration.ingress.fqdn -o tsv)
          echo "🚇 Live at: https://$FQDN"
