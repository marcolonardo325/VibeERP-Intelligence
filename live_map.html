<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transport for London (TfL) – Live Tube</title>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link  href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
<style>
  :root {
    --bg:#f5f5f5; --panel:#ffffff; --border:#e0e0e0;
    --text:#1a1a1a; --dim:#666; --accent:#003688;
    --good:#2e7d32; --warn:#f57f17; --bad:#c62828;
    --tfl-red:#E32017; --tfl-blue:#003688;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

  /* ── Layout ── */
  .header{position:fixed;top:0;left:0;right:0;z-index:1000;height:54px;
    background:#003688;display:flex;align-items:center;padding:0 16px;gap:12px;
    border-bottom:2px solid #E32017;color:#fff}
  .header svg{flex-shrink:0}
  .header h1{font-size:15px;font-weight:600;letter-spacing:.3px;color:#fff}
  .header .badge{font-size:10px;background:var(--tfl-red);color:#fff;padding:2px 8px;border-radius:10px;font-weight:700;letter-spacing:.5px}
  .header .stats{margin-left:auto;font-size:12px;color:rgba(255,255,255,.7);display:flex;gap:14px}
  .header .stats span{color:#fff;font-weight:700}

  #map{position:fixed;top:54px;left:0;right:360px;bottom:36px}

  .panel{position:fixed;top:54px;right:0;bottom:36px;width:360px;
    background:var(--panel);border-left:1px solid var(--border);
    overflow-y:auto;font-size:12px;z-index:900}
  .panel::-webkit-scrollbar{width:6px}
  .panel::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

  .status-bar{position:fixed;bottom:0;left:0;right:0;height:36px;z-index:1000;
    background:#003688;border-top:2px solid #E32017;
    display:flex;align-items:center;padding:0 16px;gap:16px;font-size:11px;color:rgba(255,255,255,.7)}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#00e676;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 4px #00e676}50%{opacity:.3;box-shadow:0 0 8px #00e676}}

  /* ── Panel Sections ── */
  .section{padding:14px 16px;border-bottom:1px solid var(--border)}
  .section h3{font-size:13px;font-weight:600;margin-bottom:10px;letter-spacing:.3px}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi{background:#f8f9fa;border:1px solid #e8e8e8;border-radius:8px;padding:10px 12px}
  .kpi .val{font-size:20px;font-weight:700}
  .kpi .lbl{font-size:10px;color:var(--dim);margin-top:2px}
  .kpi.good .val{color:var(--good)} .kpi.warn .val{color:var(--warn)}
  .kpi.bad .val{color:var(--bad)} .kpi.accent .val{color:var(--accent)}

  /* ── Arrivals Board ── */
  .arrivals-board{display:none}
  .arrivals-board.active{display:block}
  .arr-header{background:#003688;padding:10px 14px;border-radius:8px 8px 0 0;
    display:flex;align-items:center;justify-content:space-between}
  .arr-station{font-size:14px;font-weight:700;color:#FFD300;letter-spacing:.5px;text-transform:uppercase}
  .arr-close{background:none;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.7);padding:2px 8px;
    border-radius:4px;cursor:pointer;font-size:11px}
  .arr-close:hover{border-color:#FFD300;color:#FFD300}
  .arr-body{background:#1a1a2e;border-radius:0 0 8px 8px;padding:8px 0;font-family:'Consolas','Courier New',monospace}
  .arr-line-header{padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:.4px;color:#fff;
    border-bottom:1px solid #2a2a4a;display:flex;align-items:center;gap:8px}
  .arr-line-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .arr-row{display:grid;grid-template-columns:52px 1fr auto;gap:6px;
    padding:5px 14px;align-items:center;border-bottom:1px solid rgba(255,255,255,.06)}
  .arr-num{font-size:11px;text-align:left;font-weight:700}
  .arr-dest{color:#FFD300;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arr-dir{color:#aaa;font-size:10px}
  .arr-time{font-weight:700;font-size:12px;text-align:right;min-width:46px;color:#fff}
  .arr-time.due{color:#00e676} .arr-time.soon{color:#FFD300}
  .arr-empty{padding:12px 14px;color:#888;text-align:center;font-style:italic}
  .arr-hint{padding:12px 16px;color:var(--dim);text-align:center;font-size:11px}

  /* ── Map Legend Overlay ── */
  .map-legend{position:absolute;bottom:28px;right:10px;z-index:2;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:10px;padding:10px 14px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:11px;max-width:220px}
  .map-legend h4{margin:0 0 8px;font-size:12px;font-weight:700;color:#1a1a1a}
  .layer-toggles{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #ddd}
  .layer-toggle{display:flex;align-items:center;gap:7px;font-size:11px;cursor:pointer;user-select:none}
  .layer-toggle input[type=checkbox]{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}
  .layer-toggle span{font-weight:500}
  .legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:10px}
  .legend-swatch{width:14px;height:3px;border-radius:2px;flex-shrink:0}

  /* ── Asset Detail ── */
  .asset-detail{display:none}
  .asset-detail.active{display:block}
  .asset-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .asset-header .line-badge{padding:3px 10px;border-radius:12px;font-weight:700;font-size:11px;color:#fff}
  .asset-header .vid{font-size:16px;font-weight:700}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .detail-item{background:#f8f9fa;border:1px solid #e8e8e8;border-radius:6px;padding:8px 10px}
  .detail-item .dlbl{font-size:10px;color:var(--dim)}
  .detail-item .dval{font-size:13px;font-weight:600;margin-top:2px}
  .cond-bar{height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden;margin:6px 0}
  .cond-bar .fill{height:100%;border-radius:3px;transition:width .5s}
  .component-list{list-style:none}
  .component-list li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
  .status-pill{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600}
  .status-good{background:rgba(0,230,118,.15);color:var(--good)}
  .status-fair{background:rgba(255,171,0,.15);color:var(--warn)}
  .status-bad{background:rgba(255,23,68,.15);color:var(--bad)}
  .close-btn{float:right;background:none;border:1px solid #ccc;color:#666;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:11px}
  .close-btn:hover{border-color:var(--accent);color:var(--accent)}
  .wo-btn{width:100%;padding:10px;margin-top:12px;background:linear-gradient(135deg,#003688,#0098D4);
    color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;
    cursor:pointer;letter-spacing:.3px;transition:all .2s}
  .wo-btn:hover{opacity:.9;transform:translateY(-1px)}
  .wo-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

  /* ── Line Status Panel ── */
  .line-status-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s}
  .line-status-row:hover{background:#f4f6f8;border-radius:6px}
  .line-status-row:last-child{border-bottom:none}
  .ls-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:1.5px solid rgba(0,0,0,.1)}
  .ls-name{font-weight:600;font-size:11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ls-count{font-size:10px;color:var(--dim);font-weight:700;min-width:28px;text-align:right}
  .ls-badge{font-size:9px;padding:2px 6px;border-radius:8px;font-weight:700;white-space:nowrap}
  .ls-badge.good-service{background:rgba(0,230,118,.12);color:var(--good)}
  .ls-badge.minor-delays{background:rgba(255,171,0,.15);color:var(--warn)}
  .ls-badge.severe{background:rgba(255,23,68,.12);color:var(--bad)}
  .ls-badge.other{background:rgba(0,54,136,.1);color:var(--accent)}
  .ls-reason{font-size:10px;color:var(--dim);padding:4px 0 4px 20px;line-height:1.4;display:none}
  .line-status-row.expanded + .ls-reason{display:block}

  /* ── MapLibre overrides ── */
  .maplibregl-popup-content{background:#fff;border-radius:8px;padding:10px 14px;font-size:12px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.2)}
  .maplibregl-popup-close-button{font-size:16px;padding:2px 6px}
  .train-popup b{color:var(--accent)}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <svg viewBox="0 0 100 100" width="34" height="34">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#E32017" stroke-width="12"/>
    <rect x="5" y="38" width="90" height="24" rx="2" fill="#003688"/>
  </svg>
  <h1>Transport for London (TfL) – Live Tube</h1>
  <div class="badge">REAL-TIME</div>
  <div class="stats">
    <div>Trains: <span id="s-trains">&ndash;</span></div>
    <div>Lines: <span id="s-lines">&ndash;</span></div>
    <div>Stations: <span id="s-stations">&ndash;</span></div>
    <div>Data: <span id="s-age">&ndash;</span>s</div>
  </div>
</div>

<!-- MAP -->
<div id="map">
  <div class="map-legend">
    <h4>Layers</h4>
    <div class="layer-toggles">
      <label class="layer-toggle"><input type="checkbox" checked data-layers="track-lines,trail-head,trail-mid,trail-tail"><span>Tracks</span></label>
      <label class="layer-toggle"><input type="checkbox" checked data-layers="train-dots"><span>Trains</span></label>
      <label class="layer-toggle"><input type="checkbox" checked data-layers="station-icons,station-labels"><span>Stations</span></label>
    </div>
  </div>
</div>

<!-- SIDE PANEL -->
<div class="panel">
  <div class="section">
    <h3>Fleet Health</h3>
    <div class="kpi-grid" id="kpi-grid"></div>
  </div>
  <div class="section">
    <h3>Line Status <span style="font-size:10px;color:var(--dim);font-weight:400">&#x2022; click line to highlight</span></h3>
    <div id="line-status-grid"></div>
  </div>
  <div class="section">
    <h3>Arrivals Board</h3>
    <div class="arrivals-board" id="arrivals-board"></div>
    <div class="arr-hint" id="arr-hint">Click a station on the map to see live arrivals</div>
  </div>

  <div class="section">
    <h3>Lines</h3>
    <div class="legend-grid" id="legend-grid"></div>
  </div>
  <div class="section asset-detail" id="asset-detail">
    <button class="close-btn" onclick="closeAsset()">&#x2715;</button>
    <h3>Asset Details</h3>
    <div id="asset-content"></div>
  </div>
</div>

<!-- STATUS BAR -->
<div class="status-bar">
  <div class="live-dot"></div>
  <span id="status-text">Connecting...</span>
  <span style="margin-left:auto">KQL: <span id="kql-age" style="color:#FFD300">&ndash;</span>s ago</span>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
const POLL_MS = 1000;
const INTERP_MS = 1100;   // interpolation window (slightly > poll so no stutter)
const MAX_JUMP  = 0.008;  // ~800 m — teleport instead of animate

const LINE_COLORS = {
  "Bakerloo":"#B36305","Central":"#E32017","Circle":"#FFD300","District":"#00782A",
  "Hammersmith & City":"#F3A9BB","Jubilee":"#A0A5A9","Metropolitan":"#9B0056",
  "Northern":"#000000","Piccadilly":"#003688","Victoria":"#0098D4","Waterloo & City":"#95CDBA"
};

// ── State ──
let maintenanceCache = {};
let stationsByNaptan = {};
let selectedStation  = null;
let trainPopup       = null;

// Lerp state
let trainTargets     = {};  // trainKey -> [lon, lat]
let currentPositions = {};  // trainKey -> [lon, lat]
let trainStartPos    = {};  // trainKey -> [lon, lat]  (where interpolation began)
let trainStartTime   = {};  // trainKey -> Date.now()  (when target was set)
let trainVelocity    = {};  // trainKey -> [dLon, dLat] per second (for extrapolation)
let trainGeo         = { type: 'FeatureCollection', features: [] };
let trainFeatureMap  = {};  // trainKey -> feature ref (for fast coord update)
let animRunning      = false;
let lineCounts       = {};  // lineName -> count (updated each poll)
let highlightedLine  = null; // currently highlighted line name or null

// Trail state — position history per train
let trainTrails      = {};  // trainKey -> { pts: [[lon,lat],...], color, direction }
const TRAIL_LENGTH   = 30;  // ~30s of history at 1s poll
let trailGeo         = { type: 'FeatureCollection', features: [] };

// ── MapLibre GL Map ──
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
  center: [-0.12, 51.505],
  zoom: 12,
  minZoom: 10,
  maxZoom: 18,
});
map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

// ═══════════════════════════════════════════════════════════════
// LOAD STATIC DATA
// ═══════════════════════════════════════════════════════════════
async function loadStatic() {
  const [tracksR, stationsR, maintR] = await Promise.all([
    fetch('/api/tracks'), fetch('/api/stations'), fetch('/api/maintenance')
  ]);
  const trackGeo = await tracksR.json();
  const stations = await stationsR.json();
  maintenanceCache = await maintR.json();

  stations.forEach(s => { stationsByNaptan[s.naptanId] = s; });

  // ── Track lines (real curved geometry from TfL) ──
  map.addSource('tracks', { type: 'geojson', data: trackGeo });
  map.addLayer({
    id: 'track-lines', type: 'line', source: 'tracks',
    paint: {
      'line-color': ['get', 'color'],
      'line-width': ['interpolate', ['linear'], ['zoom'], 10, 3, 15, 5],
      'line-opacity': 0.45,
    },
    layout: { 'line-join': 'round', 'line-cap': 'round' },
  });

  // ── Station markers — iconic London Underground roundel ──
  const stationGeo = {
    type: 'FeatureCollection',
    features: stations.map(s => ({
      type: 'Feature',
      properties: {
        naptanId: s.naptanId,
        name: s.StationName.replace(/ Underground Station$/, '').replace(/ Station$/, ''),
        lines: (s.lines || []).join(', '),
      },
      geometry: { type: 'Point', coordinates: [s.lon, s.lat] },
    })),
  };
  map.addSource('stations', { type: 'geojson', data: stationGeo });

  // Create TfL roundel icon on a canvas
  const roundelSize = 48;
  const roundelImg = (() => {
    const c = document.createElement('canvas');
    c.width = roundelSize; c.height = roundelSize;
    const ctx = c.getContext('2d');
    const cx = roundelSize / 2, cy = roundelSize / 2;
    const r = roundelSize * 0.44;   // outer radius
    const ri = r * 0.62;            // inner white radius
    // Red circle
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#E32017'; ctx.fill();
    // White inner circle
    ctx.beginPath(); ctx.arc(cx, cy, ri, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    // Blue horizontal bar
    const barH = roundelSize * 0.22;
    ctx.fillStyle = '#003688';
    ctx.fillRect(cx - r, cy - barH / 2, r * 2, barH);
    return ctx.getImageData(0, 0, roundelSize, roundelSize);
  })();
  map.addImage('roundel', roundelImg, { pixelRatio: 2 });

  // Roundel symbol layer
  map.addLayer({
    id: 'station-icons', type: 'symbol', source: 'stations',
    layout: {
      'icon-image': 'roundel',
      'icon-size': ['interpolate', ['linear'], ['zoom'], 10, 0.3, 14, 0.55, 17, 0.85],
      'icon-allow-overlap': true,
      'icon-ignore-placement': true,
    },
  });

  // Labels (zoom >= 13)
  map.addLayer({
    id: 'station-labels', type: 'symbol', source: 'stations', minzoom: 13,
    layout: {
      'text-field': ['get', 'name'], 'text-size': 11,
      'text-font': ['Open Sans Semibold', 'Arial Unicode MS Bold'],
      'text-offset': [0, -1.3], 'text-anchor': 'bottom',
      'text-optional': true, 'text-allow-overlap': false,
    },
    paint: { 'text-color': '#1a1a1a', 'text-halo-color': '#ffffff', 'text-halo-width': 1.5 },
  });

  // ── Trail wake source — 3 opacity bands for gradient fade ──
  map.addSource('trails', { type: 'geojson', data: trailGeo });
  // Band 1: newest third — strongest
  map.addLayer({
    id: 'trail-head', type: 'line', source: 'trails',
    filter: ['==', ['get', 'band'], 1],
    paint: {
      'line-color': ['get', 'color'],
      'line-width': ['interpolate', ['linear'], ['zoom'], 10, 3, 15, 5],
      'line-opacity': 0.55,
    },
    layout: { 'line-join': 'round', 'line-cap': 'round' },
  });
  // Band 2: middle third
  map.addLayer({
    id: 'trail-mid', type: 'line', source: 'trails',
    filter: ['==', ['get', 'band'], 2],
    paint: {
      'line-color': ['get', 'color'],
      'line-width': ['interpolate', ['linear'], ['zoom'], 10, 3, 15, 5],
      'line-opacity': 0.30,
    },
    layout: { 'line-join': 'round', 'line-cap': 'round' },
  });
  // Band 3: oldest third — faintest
  map.addLayer({
    id: 'trail-tail', type: 'line', source: 'trails',
    filter: ['==', ['get', 'band'], 3],
    paint: {
      'line-color': ['get', 'color'],
      'line-width': ['interpolate', ['linear'], ['zoom'], 10, 3, 15, 5],
      'line-opacity': 0.12,
    },
    layout: { 'line-join': 'round', 'line-cap': 'round' },
  });

  // ── Trains source (empty initially, filled by refreshTrains) ──
  map.addSource('trains', { type: 'geojson', data: trainGeo });
  map.addLayer({
    id: 'train-dots', type: 'circle', source: 'trains',
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 4, 14, 7, 17, 10],
      'circle-color': ['get', 'color'],
      'circle-stroke-color': '#ffffff',
      'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 10, 1, 14, 1.5, 17, 2],
      'circle-opacity': 0.95,
    },
  });

  // ── Click/Hover interactions ──
  // Station click -> popup with name + lines, and arrivals board
  let stationPopup = null;
  map.on('click', 'station-icons', (e) => {
    const f = e.features[0]; if (!f) return;
    const p = f.properties;
    loadArrivals(p.naptanId, p.name);
    // Build line badges
    const linesList = (p.lines || '').split(', ').filter(Boolean);
    const badges = linesList.map(l => {
      const c = LINE_COLORS[l] || '#999';
      return `<span style="display:inline-block;background:${c};color:#fff;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:700;margin:2px 2px 0 0;${l==='Circle'||l==='Hammersmith & City'?'color:#1a1a1a;':''}">${l}</span>`;
    }).join('');
    if (stationPopup) stationPopup.remove();
    stationPopup = new maplibregl.Popup({ offset: 14, closeOnClick: true })
      .setLngLat(f.geometry.coordinates)
      .setHTML(`<div style="font-size:13px"><b>${p.name}</b><br>${badges}</div>`)
      .addTo(map);
  });
  map.on('mouseenter', 'station-icons', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'station-icons', () => { map.getCanvas().style.cursor = ''; });

  // Train click -> popup + asset detail
  map.on('click', 'train-dots', (e) => {
    const f = e.features[0]; if (!f) return;
    const p = f.properties;
    showAsset(p.vehicleId);
    const maint = maintenanceCache[p.vehicleId];
    const condPct = maint ? maint.overallConditionPct : '\u2013';
    const condCol = maint ? (condPct>=70?'#00e676':condPct>=55?'#ffab00':'#ff1744') : '#888';
    const svcStatus = maint ? maint.serviceStatus : '\u2013';
    if (trainPopup) trainPopup.remove();
    trainPopup = new maplibregl.Popup({ offset: 12, closeOnClick: true })
      .setLngLat(f.geometry.coordinates)
      .setHTML(`<div class="train-popup">
        <b>Train ${p.vehicleId}</b> <span style="color:${p.color};font-weight:700">${p.lineName}</span><br>
        <b>Station:</b> ${p.stationName}<br>
        <b>Towards:</b> ${p.towards||'\u2013'} &middot; <b>Dir:</b> ${p.direction||'\u2013'}<br>
        <b>ETA:</b> ${Math.floor(p.timeToStation/60)}m ${p.timeToStation%60}s<br>
        <hr style="border-color:#ddd;margin:4px 0">
        <span style="color:${condCol}">\u25a0</span> Condition: <b>${condPct}%</b> | Service: <b>${svcStatus}</b>
      </div>`)
      .addTo(map);
  });
  // Train hover tooltip
  const trainTip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12 });
  map.on('mouseenter', 'train-dots', (e) => {
    map.getCanvas().style.cursor = 'pointer';
    const p = e.features[0]?.properties;
    if (p) {
      const eta = p.timeToStation > 0 ? `${Math.floor(p.timeToStation/60)}m ${p.timeToStation%60}s` : 'At station';
      trainTip.setLngLat(e.lngLat).setHTML(
        `<div style="font-size:11px;line-height:1.5"><b style="color:${p.color}">${p.lineName}</b> ${p.vehicleId}<br>` +
        `→ ${p.towards || p.stationName}<br><b>${eta}</b></div>`
      ).addTo(map);
    }
  });
  map.on('mousemove', 'train-dots', (e) => { trainTip.setLngLat(e.lngLat); });
  map.on('mouseleave', 'train-dots', () => { map.getCanvas().style.cursor = ''; trainTip.remove(); });

  // Track hover tooltip
  const trackTip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10 });
  map.on('mouseenter', 'track-lines', (e) => {
    map.getCanvas().style.cursor = 'pointer';
    trackTip.setLngLat(e.lngLat).setHTML(`<b>${e.features[0]?.properties?.lineName||''}</b>`).addTo(map);
  });
  map.on('mousemove', 'track-lines', (e) => { trackTip.setLngLat(e.lngLat); });
  map.on('mouseleave', 'track-lines', () => { map.getCanvas().style.cursor = ''; trackTip.remove(); });

  // Header stats
  document.getElementById('s-lines').textContent    = new Set(trackGeo.features.map(f=>f.properties.lineName)).size;
  document.getElementById('s-stations').textContent = stations.length;

  // Legend
  const lg = document.getElementById('legend-grid');
  Object.entries(LINE_COLORS).forEach(([l,c]) => {
    lg.innerHTML += `<div class="legend-item"><div class="legend-swatch" style="background:${c}"></div>${l}</div>`;
  });

  // Layer toggle controls
  document.querySelectorAll('.layer-toggle input').forEach(cb => {
    cb.addEventListener('change', () => {
      const layers = cb.dataset.layers.split(',');
      const vis = cb.checked ? 'visible' : 'none';
      layers.forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', vis); });
    });
  });
}

// ARRIVALS BOARD
// ═══════════════════════════════════════════════════════════════
async function loadArrivals(naptanId, stationName) {
  selectedStation = naptanId;
  const board = document.getElementById('arrivals-board');
  document.getElementById('arr-hint').style.display = 'none';
  board.classList.add('active');
  const shortName = stationName.replace(/ Underground Station$/,'').replace(/ Station$/,'');
  board.innerHTML = `<div class="arr-header"><span class="arr-station">${shortName}</span>
    <button class="arr-close" onclick="closeArrivals()">&#x2715;</button></div>
    <div class="arr-body"><div class="arr-empty">Loading arrivals...</div></div>`;
  try {
    const r = await fetch(`/api/arrivals/${naptanId}`);
    renderArrivals(shortName, await r.json());
  } catch(e) {
    board.querySelector('.arr-body').innerHTML = '<div class="arr-empty">Unable to load arrivals</div>';
  }
}

function renderArrivals(stationName, arrivals) {
  const board = document.getElementById('arrivals-board');
  if (!arrivals || arrivals.length === 0) {
    board.innerHTML = `<div class="arr-header"><span class="arr-station">${stationName}</span>
      <button class="arr-close" onclick="closeArrivals()">&#x2715;</button></div>
      <div class="arr-body"><div class="arr-empty">No trains expected in next 20 minutes</div></div>`;
    return;
  }
  const byLine = {};
  arrivals.forEach(a => { byLine[a.lineName] = byLine[a.lineName] || []; byLine[a.lineName].push(a); });
  let bodyHtml = '';
  Object.entries(byLine).forEach(([line, trains]) => {
    const color = LINE_COLORS[line] || '#999';
    bodyHtml += `<div class="arr-line-header"><div class="arr-line-dot" style="background:${color}"></div>${line}</div>`;
    trains.slice(0, 4).forEach(t => {
      const dest = t.towards || t.destinationName || '\u2013';
      const secs = t.timeToStation;
      let timeStr, timeCls;
      if (secs <= 5) { timeStr = 'Due'; timeCls = 'due'; }
      else if (secs <= 45) { timeStr = '1 min'; timeCls = 'due'; }
      else { timeStr = `${Math.max(2, Math.round(secs/60))} min`; timeCls = secs <= 180 ? 'soon' : ''; }
      bodyHtml += `<div class="arr-row">
        <span class="arr-num" style="color:${color}">${t.vehicleId}</span>
        <span class="arr-dest">${dest}<br><span class="arr-dir">${t.direction||''}</span></span>
        <span class="arr-time ${timeCls}">${timeStr}</span></div>`;
    });
  });
  board.innerHTML = `<div class="arr-header"><span class="arr-station">${stationName}</span>
    <button class="arr-close" onclick="closeArrivals()">&#x2715;</button></div>
    <div class="arr-body">${bodyHtml}</div>`;
}

function closeArrivals() {
  selectedStation = null;
  document.getElementById('arrivals-board').classList.remove('active');
  document.getElementById('arr-hint').style.display = 'block';
}

// Auto-refresh arrivals every 15s
setInterval(async () => {
  if (!selectedStation) return;
  const s = stationsByNaptan[selectedStation]; if (!s) return;
  try {
    const r = await fetch(`/api/arrivals/${selectedStation}`);
    renderArrivals(s.StationName.replace(/ Underground Station$/,'').replace(/ Station$/,''), await r.json());
  } catch(e) {}
}, 15000);

async function createWorkOrder(vehicleId) {
  const btn = document.querySelector('.wo-btn'); if (!btn) return;
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'Creating Work Order...';
  try {
    const r = await fetch('/api/work-order', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({vehicleId})
    });
    const d = await r.json();
    if (d.success) {
      btn.textContent = '\u2713 ' + d.workOrder + (d.emailSent ? ' \u2014 Email Sent' : ' \u2014 Saved');
      btn.style.background = 'var(--good)'; btn.style.color = '#fff';
    } else {
      btn.textContent = '\u2717 ' + (d.error||'Failed').substring(0,60);
      btn.style.background = 'var(--bad)';
      setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; btn.disabled = false; }, 4000);
    }
  } catch(e) {
    btn.textContent = '\u2717 Network error'; btn.style.background = 'var(--bad)';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; btn.disabled = false; }, 4000);
  }
}

// ═══════════════════════════════════════════════════════════════
// TRAIN REFRESH + 60fps LERP ANIMATION
// ═══════════════════════════════════════════════════════════════
async function refreshTrains() {
  try {
    const r = await fetch('/api/trains');
    const data = await r.json();
    if (!data.trains) return;

    const newTargets = {};
    const features = [];

    data.trains.forEach(t => {
      const key = t.trainKey;
      const color = LINE_COLORS[t.lineName] || '#999';
      const newTgt = [t.lon, t.lat];

      if (!currentPositions[key]) {
        // Brand-new train — teleport
        currentPositions[key] = [t.lon, t.lat];
        trainStartPos[key]   = [t.lon, t.lat];
        trainVelocity[key]   = [0, 0];
      } else {
        const cur = currentPositions[key];
        const dx = newTgt[0] - cur[0];
        const dy = newTgt[1] - cur[1];
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > MAX_JUMP) {
          // Huge jump (line change / data glitch) — teleport
          currentPositions[key] = [t.lon, t.lat];
          trainStartPos[key]   = [t.lon, t.lat];
          trainVelocity[key]   = [0, 0];
        } else {
          // Compute velocity (units per second) from old position to new target
          trainVelocity[key] = dist > 0.0000001 ? [dx / (POLL_MS / 1000), dy / (POLL_MS / 1000)] : (trainVelocity[key] || [0, 0]);
          trainStartPos[key] = [cur[0], cur[1]];
        }
      }
      trainStartTime[key] = Date.now();
      newTargets[key] = newTgt;

      features.push({
        type: 'Feature',
        properties: {
          trainKey: key, vehicleId: t.vehicleId, lineName: t.lineName,
          color, stationName: t.stationName,
          direction: t.direction || '', towards: t.towards || '',
          timeToStation: t.timeToStation, bearing: t.bearing || 0,
        },
        geometry: { type: 'Point', coordinates: [currentPositions[key][0], currentPositions[key][1]] },
      });
    });

    trainTargets = newTargets;
    trainGeo = { type: 'FeatureCollection', features };

    // Build lookup for O(1) access in animLoop
    trainFeatureMap = {};
    features.forEach(f => { trainFeatureMap[f.properties.trainKey] = f; });

    // Clean up departed trains
    const activeKeys = new Set(Object.keys(newTargets));
    for (const k of Object.keys(currentPositions)) {
      if (!activeKeys.has(k)) {
        delete currentPositions[k];
        delete trainStartPos[k];
        delete trainStartTime[k];
        delete trainVelocity[k];
      }
    }
    for (const k of Object.keys(trainTrails)) {
      if (!activeKeys.has(k)) delete trainTrails[k];
    }

    // Start animation loop if not already running
    if (!animRunning) { animRunning = true; requestAnimationFrame(animLoop); }

    // Update header stats
    document.getElementById('s-trains').textContent    = data.count;
    document.getElementById('s-age').textContent       = data.fetchAge;
    document.getElementById('kql-age').textContent     = data.fetchAge;
    document.getElementById('status-text').textContent =
      `Live \u2014 ${data.count} trains \u2014 ${new Date(data.timestamp).toLocaleTimeString()}`;

    // Update per-line counts (drives the Line Status panel)
    if (data.lineCounts) lineCounts = data.lineCounts;
  } catch(e) {
    document.getElementById('status-text').textContent = '\u26a0 Reconnecting...';
  }
}

// Catmull-Rom spline: takes an array of [lon,lat] and returns a smoothed path
// with `subdivisions` extra points between each pair.
function catmullRomSmooth(points, subdivisions) {
  if (points.length < 3) return points;
  const sub = subdivisions || 4;
  const out = [];

  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[Math.max(i - 1, 0)];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[Math.min(i + 2, points.length - 1)];

    out.push(p1);
    for (let t = 1; t < sub; t++) {
      const s = t / sub;
      const s2 = s * s;
      const s3 = s2 * s;
      const lon = 0.5 * ((2 * p1[0]) +
        (-p0[0] + p2[0]) * s +
        (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * s2 +
        (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * s3);
      const lat = 0.5 * ((2 * p1[1]) +
        (-p0[1] + p2[1]) * s +
        (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * s2 +
        (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * s3);
      out.push([lon, lat]);
    }
  }
  out.push(points[points.length - 1]);
  return out;
}

// Build trail GeoJSON — smooths via Catmull-Rom then splits into 3 opacity bands.
// The trail is ordered oldest→newest so:
//   tail = oldest 1/3, mid = middle 1/3, head = newest 1/3
// HEAD band is near the train (darkest), TAIL fades away behind it.
function buildTrailGeo() {
  const features = [];
  for (const key of Object.keys(trainTrails)) {
    const { pts, color, direction } = trainTrails[key];
    if (pts.length < 3) continue;

    // Smooth the raw positions into a nice curve
    const smooth = catmullRomSmooth(pts, 4);
    const n = smooth.length;

    // Split smoothed path into 3 bands
    const t1 = Math.floor(n / 3);
    const t2 = Math.floor(2 * n / 3);

    // Band 3 (tail/oldest) — faintest
    if (t1 >= 1) {
      features.push({
        type: 'Feature',
        properties: { color, band: 3, direction },
        geometry: { type: 'LineString', coordinates: smooth.slice(0, t1 + 1) },
      });
    }
    // Band 2 (mid)
    if (t2 > t1) {
      features.push({
        type: 'Feature',
        properties: { color, band: 2, direction },
        geometry: { type: 'LineString', coordinates: smooth.slice(t1, t2 + 1) },
      });
    }
    // Band 1 (head/newest) — strongest
    if (n - 1 > t2) {
      features.push({
        type: 'Feature',
        properties: { color, band: 1, direction },
        geometry: { type: 'LineString', coordinates: smooth.slice(t2) },
      });
    }
  }
  trailGeo = { type: 'FeatureCollection', features };
  const src = map.getSource('trails');
  if (src) src.setData(trailGeo);
}

function animLoop() {
  const src = map.getSource('trains');
  if (!src) { requestAnimationFrame(animLoop); return; }

  const now = Date.now();
  for (const key of Object.keys(trainTargets)) {
    const cur   = currentPositions[key];
    const tgt   = trainTargets[key];
    const start = trainStartPos[key];
    const st    = trainStartTime[key];
    const vel   = trainVelocity[key];
    if (!cur || !tgt || !start || !st) continue;

    const elapsed = now - st;
    const t = Math.min(1.0, elapsed / INTERP_MS);
    // Interpolate from start to target
    let x = start[0] + (tgt[0] - start[0]) * t;
    let y = start[1] + (tgt[1] - start[1]) * t;

    // If we've reached the target and have velocity, extrapolate gently
    // This prevents trains from "stopping" between polls
    if (t >= 1.0 && vel && (Math.abs(vel[0]) > 1e-8 || Math.abs(vel[1]) > 1e-8)) {
      const extra = (elapsed - INTERP_MS) / 1000; // seconds past target
      const decay = Math.max(0, 1 - extra * 1.5);  // fade out over ~0.67s
      x += vel[0] * extra * decay * 0.3;
      y += vel[1] * extra * decay * 0.3;
    }

    cur[0] = x;
    cur[1] = y;

    const f = trainFeatureMap[key];
    if (f) f.geometry.coordinates = [cur[0], cur[1]];
  }

  src.setData(trainGeo);

  // Subtle pulse on train dots radius (breathe effect)
  if (map.getLayer('train-dots')) {
    const pulse = 1 + 0.12 * Math.sin(now / 600);
    map.setPaintProperty('train-dots', 'circle-radius',
      ['interpolate', ['linear'], ['zoom'], 10, 4*pulse, 14, 7*pulse, 17, 10*pulse]);
  }

  requestAnimationFrame(animLoop);
}

// ═══════════════════════════════════════════════════════════════
// LINE STATUS
// ═══════════════════════════════════════════════════════════════
let lineStatusCache = [];

async function loadLineStatus() {
  try {
    const r = await fetch('/api/line-status');
    lineStatusCache = await r.json();
  } catch(e) {}
  renderLineStatus();
}

function renderLineStatus() {
  const grid = document.getElementById('line-status-grid');
  if (!grid) return;
  const order = Object.keys(LINE_COLORS);
  // Build a map from cache
  const byName = {};
  lineStatusCache.forEach(s => { byName[s.lineName] = s; });

  let html = '';
  order.forEach(name => {
    const color = LINE_COLORS[name];
    const s = byName[name] || { status: '—', severity: 0, reason: '' };
    const count = lineCounts[name] || 0;
    let badgeCls = 'other';
    if (s.severity === 10) badgeCls = 'good-service';
    else if (s.severity >= 6) badgeCls = 'minor-delays';
    else if (s.severity >= 1 && s.severity <= 5) badgeCls = 'severe';
    const hl = highlightedLine === name ? ' style="background:#e8edf5;border-radius:6px"' : '';
    html += `<div class="line-status-row" data-line="${name}"${hl}>
      <div class="ls-dot" style="background:${color}"></div>
      <div class="ls-name">${name}</div>
      <div class="ls-count">${count} 🚇</div>
      <div class="ls-badge ${badgeCls}">${s.status}</div>
    </div>`;
    if (s.reason) html += `<div class="ls-reason">${s.reason}</div>`;
  });
  grid.innerHTML = html;

  // Click to highlight a line on the map
  grid.querySelectorAll('.line-status-row').forEach(row => {
    row.addEventListener('click', () => {
      const ln = row.dataset.line;
      if (highlightedLine === ln) {
        highlightedLine = null; // toggle off
      } else {
        highlightedLine = ln;
      }
      applyLineHighlight();
      renderLineStatus(); // re-render to show selection
    });
  });
}

function applyLineHighlight() {
  if (!map.getLayer('track-lines')) return;
  if (highlightedLine) {
    map.setPaintProperty('track-lines', 'line-opacity', [
      'case', ['==', ['get', 'lineName'], highlightedLine], 0.85, 0.12
    ]);
    map.setPaintProperty('track-lines', 'line-width', [
      'case', ['==', ['get', 'lineName'], highlightedLine],
      ['interpolate', ['linear'], ['zoom'], 10, 5, 15, 8],
      ['interpolate', ['linear'], ['zoom'], 10, 2, 15, 3]
    ]);
  } else {
    map.setPaintProperty('track-lines', 'line-opacity', 0.45);
    map.setPaintProperty('track-lines', 'line-width',
      ['interpolate', ['linear'], ['zoom'], 10, 3, 15, 5]);
  }
}

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════
map.on('load', async () => {
  await loadStatic();
  await loadFleetHealth();
  await loadLineStatus();
  await refreshTrains();
  renderLineStatus(); // render once with initial counts
  setInterval(refreshTrains, POLL_MS);
  setInterval(loadFleetHealth, 60000);
  setInterval(loadLineStatus, 30000);  // refresh status every 30s
  // Re-render line status panel every 2s to pick up train count changes
  setInterval(renderLineStatus, 2000);
});
</script>
