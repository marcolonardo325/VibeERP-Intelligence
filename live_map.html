<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transport for London (TfL) – Live Tube</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg:#f5f5f5; --panel:#ffffff; --border:#e0e0e0;
    --text:#1a1a1a; --dim:#666; --accent:#003688;
    --good:#2e7d32; --warn:#f57f17; --bad:#c62828;
    --tfl-red:#E32017; --tfl-blue:#003688;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

  /* ── Layout ── */
  .header{position:fixed;top:0;left:0;right:0;z-index:1000;height:54px;
    background:#003688;
    display:flex;align-items:center;padding:0 16px;gap:12px;
    border-bottom:2px solid #E32017;color:#fff}
  .header img{height:28px}
  .header h1{font-size:15px;font-weight:600;letter-spacing:.3px;color:#fff}
  .header .badge{font-size:10px;background:var(--tfl-red);color:#fff;padding:2px 8px;border-radius:10px;font-weight:700;letter-spacing:.5px}
  .header .stats{margin-left:auto;font-size:12px;color:rgba(255,255,255,.7);display:flex;gap:14px}
  .header .stats span{color:#fff;font-weight:700}

  #map{position:fixed;top:54px;left:0;right:360px;bottom:36px}

  .panel{position:fixed;top:54px;right:0;bottom:36px;width:360px;
    background:var(--panel);border-left:1px solid var(--border);
    overflow-y:auto;font-size:12px;z-index:900}
  .panel::-webkit-scrollbar{width:6px}
  .panel::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

  .status-bar{position:fixed;bottom:0;left:0;right:0;height:36px;z-index:1000;
    background:#003688;border-top:2px solid #E32017;
    display:flex;align-items:center;padding:0 16px;gap:16px;font-size:11px;color:rgba(255,255,255,.7)}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#00e676;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 4px #00e676}50%{opacity:.3;box-shadow:0 0 8px #00e676}}

  /* ── Panel Sections ── */
  .section{padding:14px 16px;border-bottom:1px solid var(--border)}
  .section h3{font-size:13px;font-weight:600;margin-bottom:10px;letter-spacing:.3px}

  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi{background:#f8f9fa;border:1px solid #e8e8e8;border-radius:8px;padding:10px 12px}
  .kpi .val{font-size:20px;font-weight:700}
  .kpi .lbl{font-size:10px;color:var(--dim);margin-top:2px}
  .kpi.good .val{color:var(--good)} .kpi.warn .val{color:var(--warn)}
  .kpi.bad .val{color:var(--bad)} .kpi.accent .val{color:var(--accent)}

  /* ── Arrivals Board (TfL style) ── */
  .arrivals-board{display:none}
  .arrivals-board.active{display:block}
  .arr-header{background:#003688;padding:10px 14px;border-radius:8px 8px 0 0;
    display:flex;align-items:center;justify-content:space-between}
  .arr-station{font-size:14px;font-weight:700;color:#FFD300;letter-spacing:.5px;text-transform:uppercase}
  .arr-close{background:none;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.7);padding:2px 8px;
    border-radius:4px;cursor:pointer;font-size:11px}
  .arr-close:hover{border-color:#FFD300;color:#FFD300}

  .arr-body{background:#1a1a2e;border-radius:0 0 8px 8px;padding:8px 0;
    font-family:'Consolas','Courier New',monospace}

  .arr-line-header{padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:.4px;color:#fff;
    border-bottom:1px solid #2a2a4a;display:flex;align-items:center;gap:8px}
  .arr-line-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

  .arr-row{display:grid;grid-template-columns:52px 1fr auto;gap:6px;
    padding:5px 14px;align-items:center;border-bottom:1px solid rgba(255,255,255,.06)}
  .arr-num{font-size:11px;text-align:left;font-weight:700}
  .arr-dest{color:#FFD300;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arr-dir{color:#aaa;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arr-time{font-weight:700;font-size:12px;text-align:right;min-width:46px;color:#fff}
  .arr-time.due{color:#00e676}
  .arr-time.soon{color:#FFD300}
  .arr-time.delayed{color:#ff1744}

  .arr-empty{padding:12px 14px;color:#888;text-align:center;font-style:italic}
  .arr-hint{padding:12px 16px;color:var(--dim);text-align:center;font-size:11px}

  /* ── Legend ── */
  .legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px}
  .legend-swatch{width:16px;height:3px;border-radius:2px;flex-shrink:0}

  /* ── Asset Detail ── */
  .asset-detail{display:none}
  .asset-detail.active{display:block}
  .asset-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .asset-header .line-badge{padding:3px 10px;border-radius:12px;font-weight:700;font-size:11px;color:#fff}
  .asset-header .vid{font-size:16px;font-weight:700}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .detail-item{background:#f8f9fa;border:1px solid #e8e8e8;border-radius:6px;padding:8px 10px}
  .detail-item .dlbl{font-size:10px;color:var(--dim)}
  .detail-item .dval{font-size:13px;font-weight:600;margin-top:2px}
  .cond-bar{height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden;margin:6px 0}
  .cond-bar .fill{height:100%;border-radius:3px;transition:width .5s}
  .component-list{list-style:none}
  .component-list li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
  .status-pill{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600}
  .status-good{background:rgba(0,230,118,.15);color:var(--good)}
  .status-fair{background:rgba(255,171,0,.15);color:var(--warn)}
  .status-bad{background:rgba(255,23,68,.15);color:var(--bad)}
  .close-btn{float:right;background:none;border:1px solid #ccc;color:#666;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:11px}
  .close-btn:hover{border-color:var(--accent);color:var(--accent)}

  .wo-btn{width:100%;padding:10px;margin-top:12px;background:linear-gradient(135deg,#003688,#0098D4);
    color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;
    cursor:pointer;letter-spacing:.3px;transition:all .2s}
  .wo-btn:hover{opacity:.9;transform:translateY(-1px)}
  .wo-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

  /* ── Map overrides ── */
  .station-tooltip{font-weight:600;font-size:11px}
  .train-popup{font-size:12px;line-height:1.5}
  .train-popup b{color:var(--accent)}
  .leaflet-control-layers{background:#fff!important;color:#333!important;border:1px solid #ccc!important;border-radius:8px!important}
  .leaflet-control-layers label{color:#333!important}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <svg viewBox="0 0 100 100" width="34" height="34" style="flex-shrink:0">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#E32017" stroke-width="12"/>
    <rect x="5" y="38" width="90" height="24" rx="2" fill="#003688"/>
  </svg>
  <h1>Transport for London (TfL) – Live Tube</h1>
  <div class="badge">REAL-TIME</div>
  <div class="stats">
    <div>Trains: <span id="s-trains">–</span></div>
    <div>Lines: <span id="s-lines">–</span></div>
    <div>Stations: <span id="s-stations">–</span></div>
    <div>Data: <span id="s-age">–</span>s</div>
  </div>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- SIDE PANEL -->
<div class="panel">
  <!-- Fleet Health -->
  <div class="section">
    <h3>📊 Fleet Health</h3>
    <div class="kpi-grid" id="kpi-grid"></div>
  </div>

  <!-- Arrivals Board -->
  <div class="section">
    <h3>🚏 Arrivals Board</h3>
    <div class="arrivals-board" id="arrivals-board"></div>
    <div class="arr-hint" id="arr-hint">Click a station on the map to see live arrivals</div>
  </div>

  <!-- Legend -->
  <div class="section">
    <h3>🚇 Lines</h3>
    <div class="legend-grid" id="legend-grid"></div>
  </div>

  <!-- Asset Detail -->
  <div class="section asset-detail" id="asset-detail">
    <button class="close-btn" onclick="closeAsset()">✕</button>
    <h3>🔧 Asset Details</h3>
    <div id="asset-content"></div>
  </div>
</div>

<!-- STATUS BAR -->
<div class="status-bar">
  <div class="live-dot"></div>
  <span id="status-text">Connecting...</span>
  <span style="margin-left:auto">KQL: <span id="kql-age" style="color:#FFD300">–</span>s ago</span>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
const POLL_MS  = 1000;
const LINE_COLORS = {
  "Bakerloo":"#B36305","Central":"#E32017","Circle":"#FFD300","District":"#00782A",
  "Hammersmith & City":"#F3A9BB","Jubilee":"#A0A5A9","Metropolitan":"#9B0056",
  "Northern":"#000000","Piccadilly":"#003688","Victoria":"#0098D4","Waterloo & City":"#95CDBA"
};

// ── Map ──
const map = L.map('map',{center:[51.505,-0.12],zoom:12,zoomControl:false,attributionControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);
L.control.attribution({position:'bottomleft'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
  attribution:'© OpenStreetMap © CARTO',maxZoom:19
}).addTo(map);

const trackLayers  = L.layerGroup().addTo(map);
const stationLayer = L.layerGroup().addTo(map);
const trainLayer   = L.layerGroup().addTo(map);

// ── Icons ──
// TfL Roundel SVG for stations
function makeRoundelIcon(size) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="${size}" height="${size}">
    <circle cx="20" cy="20" r="15" fill="none" stroke="#E32017" stroke-width="5"/>
    <rect x="3" y="15" width="34" height="10" rx="1.5" fill="#003688"/>
  </svg>`;
  return L.divIcon({
    html: svg, className: '',
    iconSize: [size, size], iconAnchor: [size/2, size/2], popupAnchor: [0, -size/2]
  });
}
const stationIcon = makeRoundelIcon(20);

// Train SVG icon per line color
function makeTrainIcon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="24" height="24">
    <rect x="6" y="2" width="20" height="24" rx="5" fill="${color}" stroke="#fff" stroke-width="1.5"/>
    <rect x="9" y="5" width="14" height="8" rx="2" fill="#fff" opacity=".9"/>
    <circle cx="11" cy="22" r="2" fill="#fff"/>
    <circle cx="21" cy="22" r="2" fill="#fff"/>
    <rect x="13" y="16" width="6" height="3" rx="1" fill="#fff" opacity=".5"/>
    <rect x="12" y="26" width="3" height="3" rx=".5" fill="${color}" stroke="#fff" stroke-width=".8"/>
    <rect x="17" y="26" width="3" height="3" rx=".5" fill="${color}" stroke="#fff" stroke-width=".8"/>
  </svg>`;
  return L.divIcon({html:svg,className:'',iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-14]});
}
const trainIcons = {};
Object.entries(LINE_COLORS).forEach(([l,c]) => { trainIcons[l] = makeTrainIcon(c); });

// ── State ──
const trainState = {};       // vehicleId → {marker, currentLat/Lon, targetLat/Lon, data}
let maintenanceCache = {};
let stationsByNaptan = {};   // naptanId → {StationName, lat, lon}
let selectedStation = null;

// ══════════════════════════════════════════════════════════════════════════════
// LOAD STATIC DATA
// ══════════════════════════════════════════════════════════════════════════════
async function loadStatic() {
  const [tracksR, stationsR, maintR] = await Promise.all([
    fetch('/api/tracks'), fetch('/api/stations'), fetch('/api/maintenance')
  ]);
  const tracks   = await tracksR.json();
  const stations = await stationsR.json();
  maintenanceCache = await maintR.json();

  // Build station lookup
  stations.forEach(s => { stationsByNaptan[s.naptanId] = s; });

  // Draw track polylines (now NN-ordered, no zig-zag)
  let lineCount = 0;
  Object.entries(tracks).forEach(([line, coords]) => {
    lineCount++;
    L.polyline(coords, {
      color: LINE_COLORS[line] || '#999', weight: 4, opacity: .8, lineJoin: 'round'
    }).bindTooltip(line, {sticky:true, className:'station-tooltip', direction:'top'})
     .addTo(trackLayers);
  });

  // Draw station markers with TfL Roundel
  stations.forEach(s => {
    const m = L.marker([s.lat, s.lon], {icon: stationIcon})
      .bindTooltip(s.StationName.replace(/ Underground Station$/,'').replace(/ Station$/,''), {
        className:'station-tooltip', direction:'top', offset:[0,-8]
      })
      .on('click', () => loadArrivals(s.naptanId, s.StationName))
      .addTo(stationLayer);
  });

  document.getElementById('s-lines').textContent    = lineCount;
  document.getElementById('s-stations').textContent = stations.length;

  // Legend
  const lg = document.getElementById('legend-grid');
  Object.entries(LINE_COLORS).forEach(([l,c]) => {
    lg.innerHTML += `<div class="legend-item"><div class="legend-swatch" style="background:${c}"></div>${l}</div>`;
  });
}

// ══════════════════════════════════════════════════════════════════════════════
// ARRIVALS BOARD
// ══════════════════════════════════════════════════════════════════════════════
async function loadArrivals(naptanId, stationName) {
  selectedStation = naptanId;
  const board = document.getElementById('arrivals-board');
  const hint  = document.getElementById('arr-hint');
  hint.style.display = 'none';
  board.classList.add('active');

  const shortName = stationName.replace(/ Underground Station$/,'').replace(/ Station$/,'');

  board.innerHTML = `
    <div class="arr-header">
      <span class="arr-station">${shortName}</span>
      <button class="arr-close" onclick="closeArrivals()">✕</button>
    </div>
    <div class="arr-body"><div class="arr-empty">Loading arrivals...</div></div>`;

  try {
    const r = await fetch(`/api/arrivals/${naptanId}`);
    const arrivals = await r.json();
    renderArrivals(shortName, arrivals);
  } catch(e) {
    board.querySelector('.arr-body').innerHTML = '<div class="arr-empty">Unable to load arrivals</div>';
  }
}

function renderArrivals(stationName, arrivals) {
  const board = document.getElementById('arrivals-board');
  if (!arrivals || arrivals.length === 0) {
    board.innerHTML = `
      <div class="arr-header">
        <span class="arr-station">${stationName}</span>
        <button class="arr-close" onclick="closeArrivals()">✕</button>
      </div>
      <div class="arr-body"><div class="arr-empty">No trains expected in next 20 minutes</div></div>`;
    return;
  }

  // Group by line
  const byLine = {};
  arrivals.forEach(a => {
    byLine[a.lineName] = byLine[a.lineName] || [];
    byLine[a.lineName].push(a);
  });

  let bodyHtml = '';
  Object.entries(byLine).forEach(([line, trains]) => {
    const color = LINE_COLORS[line] || '#999';
    bodyHtml += `<div class="arr-line-header"><div class="arr-line-dot" style="background:${color}"></div>${line}</div>`;

    trains.slice(0, 4).forEach((t, i) => {
      const dest = t.towards || t.destinationName || '–';
      const dir = t.direction || '';
      const secs = t.timeToStation;
      let timeStr, timeCls;

      if (secs <= 5) {
        timeStr = 'Due'; timeCls = 'due';
      } else if (secs <= 45) {
        timeStr = '1 min'; timeCls = 'due';
      } else {
        timeStr = `${Math.max(2, Math.round(secs/60))} min`;
        timeCls = secs <= 180 ? 'soon' : '';
      }

      bodyHtml += `<div class="arr-row">
        <span class="arr-num" style="color:${color}">${t.vehicleId}</span>
        <span class="arr-dest">${dest}<br><span class="arr-dir">${dir}</span></span>
        <span class="arr-time ${timeCls}">${timeStr}</span>
      </div>`;
    });
  });

  board.innerHTML = `
    <div class="arr-header">
      <span class="arr-station">${stationName}</span>
      <button class="arr-close" onclick="closeArrivals()">✕</button>
    </div>
    <div class="arr-body">${bodyHtml}</div>`;
}

function closeArrivals() {
  selectedStation = null;
  document.getElementById('arrivals-board').classList.remove('active');
  document.getElementById('arr-hint').style.display = 'block';
}

// Auto-refresh arrivals every 15s
setInterval(async () => {
  if (!selectedStation) return;
  const s = stationsByNaptan[selectedStation];
  if (!s) return;
  try {
    const r = await fetch(`/api/arrivals/${selectedStation}`);
    const arrivals = await r.json();
    const name = s.StationName.replace(/ Underground Station$/,'').replace(/ Station$/,'');
    renderArrivals(name, arrivals);
  } catch(e) {}
}, 15000);

// ══════════════════════════════════════════════════════════════════════════════
// FLEET HEALTH
// ══════════════════════════════════════════════════════════════════════════════
async function loadFleetHealth() {
  const r = await fetch('/api/fleet-health');
  const h = await r.json();
  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi accent"><div class="val">${h.totalVehicles||0}</div><div class="lbl">Total Vehicles</div></div>
    <div class="kpi ${h.avgCondition>=70?'good':h.avgCondition>=55?'warn':'bad'}"><div class="val">${h.avgCondition||0}%</div><div class="lbl">Avg Condition</div></div>
    <div class="kpi good"><div class="val">${h.good||0}</div><div class="lbl">Good Health</div></div>
    <div class="kpi warn"><div class="val">${h.needsAttention||0}</div><div class="lbl">Needs Attention</div></div>
    <div class="kpi bad"><div class="val">${h.critical||0}</div><div class="lbl">Critical</div></div>
    <div class="kpi warn"><div class="val">${h.overdueService||0}</div><div class="lbl">Overdue Service</div></div>
    <div class="kpi accent"><div class="val">${h.totalWorkOrders||0}</div><div class="lbl">Open Work Orders</div></div>
    <div class="kpi ${h.totalAlerts>0?'bad':'good'}"><div class="val">${h.totalAlerts||0}</div><div class="lbl">Critical Alerts</div></div>`;
}

// ══════════════════════════════════════════════════════════════════════════════
// ASSET DETAIL
// ══════════════════════════════════════════════════════════════════════════════
function showAsset(vehicleId) {
  const a = maintenanceCache[vehicleId];
  if (!a) return;
  const det = document.getElementById('asset-detail');
  const con = document.getElementById('asset-content');
  const condColor = a.overallConditionPct>=70?'var(--good)':a.overallConditionPct>=55?'var(--warn)':'var(--bad)';

  function pill(s) {
    const c = s==='Good'||s==='Normal'?'status-good':s==='Fair'||s==='Reduced'||s==='Due Soon'?'status-fair':'status-bad';
    return `<span class="status-pill ${c}">${s}</span>`;
  }

  con.innerHTML = `
    <div class="asset-header">
      <div class="line-badge" style="background:${a.lineColor}">${a.lineName}</div>
      <div class="vid">Train ${a.vehicleId}</div>
    </div>
    <div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:11px">
        <span>Overall Condition</span><span style="color:${condColor};font-weight:700">${a.overallConditionPct}%</span>
      </div>
      <div class="cond-bar"><div class="fill" style="width:${a.overallConditionPct}%;background:${condColor}"></div></div>
    </div>
    <div class="detail-grid">
      <div class="detail-item"><div class="dlbl">Model</div><div class="dval">${a.model}</div></div>
      <div class="detail-item"><div class="dlbl">Manufacturer</div><div class="dval">${a.manufacturer}</div></div>
      <div class="detail-item"><div class="dlbl">Year</div><div class="dval">${a.yearManufactured}</div></div>
      <div class="detail-item"><div class="dlbl">Mileage</div><div class="dval">${(a.totalMileageKm/1000).toFixed(0)}k km</div></div>
      <div class="detail-item"><div class="dlbl">Daily Avg</div><div class="dval">${a.dailyAvgKm} km</div></div>
      <div class="detail-item"><div class="dlbl">Running Hours</div><div class="dval">${a.runningHours}h</div></div>
      <div class="detail-item"><div class="dlbl">Last Service</div><div class="dval">${a.lastServiceDate}</div></div>
      <div class="detail-item"><div class="dlbl">Next Service</div><div class="dval">${a.nextServiceDue}</div></div>
    </div>
    <div style="margin-bottom:8px">Service: ${pill(a.serviceStatus)} Wheel Wear: <span style="font-weight:700;color:${a.wheelWearPct>60?'var(--bad)':a.wheelWearPct>35?'var(--warn)':'var(--good)'}">${a.wheelWearPct}%</span></div>
    <h4 style="font-size:12px;margin:10px 0 6px;color:var(--dim)">COMPONENTS</h4>
    <ul class="component-list">
      <li><span>Brakes</span>${pill(a.brakeCondition)}</li>
      <li><span>Door System</span>${pill(a.doorSystemStatus)}</li>
      <li><span>HVAC</span>${pill(a.hvacStatus)}</li>
      <li><span>Traction Motor</span>${pill(a.tractionMotor)}</li>
      <li><span>Bogie</span>${pill(a.bogieCondition)}</li>
    </ul>
    <div class="detail-grid" style="margin-top:10px">
      <div class="detail-item"><div class="dlbl">Work Orders</div><div class="dval" style="color:${a.openWorkOrders>2?'var(--warn)':'var(--text)'}">${a.openWorkOrders}</div></div>
      <div class="detail-item"><div class="dlbl">Critical Alerts</div><div class="dval" style="color:${a.criticalAlerts>0?'var(--bad)':'var(--good)'}">${a.criticalAlerts}</div></div>
      <div class="detail-item"><div class="dlbl">Pending Parts</div><div class="dval">${a.pendingParts}</div></div>
      <div class="detail-item"><div class="dlbl">Last Inspection</div><div class="dval">${a.lastInspectionDate}</div></div>
    </div>
    <button class="wo-btn" onclick="createWorkOrder('${a.vehicleId}')">📋 Create Work Order in D365 F&amp;O</button>`;
  det.classList.add('active');
  det.scrollIntoView({behavior:'smooth'});
}
function closeAsset() { document.getElementById('asset-detail').classList.remove('active'); }

async function createWorkOrder(vehicleId) {
  const btn = document.querySelector('.wo-btn');
  if (!btn) return;
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ Creating Work Order...';
  try {
    const r = await fetch('/api/work-order', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({vehicleId})
    });
    const d = await r.json();
    if (d.success) {
      const emailNote = d.emailSent ? ' — Email Sent' : ' — Saved (email not configured)';
      btn.textContent = '✓ ' + d.workOrder + emailNote;
      btn.style.background = 'var(--good)'; btn.style.color = '#fff';
    } else {
      btn.textContent = '✗ ' + (d.error||'Failed').substring(0,60);
      btn.style.background = 'var(--bad)';
      setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; btn.disabled = false; }, 4000);
    }
  } catch(e) {
    btn.textContent = '✗ Network error';
    btn.style.background = 'var(--bad)';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; btn.disabled = false; }, 4000);
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// TRAIN REFRESH (poll every 1s, NO page refresh)
// ══════════════════════════════════════════════════════════════════════════════
async function refreshTrains() {
  try {
    const r = await fetch('/api/trains');
    const data = await r.json();
    if (!data.trains) return;

    const newIds = new Set(data.trains.map(t => t.vehicleId));

    // Remove departed trains
    Object.keys(trainState).forEach(id => {
      if (!newIds.has(id)) { trainState[id].marker.remove(); delete trainState[id]; }
    });

    // Update / create
    data.trains.forEach(t => {
      const icon = trainIcons[t.lineName] || trainIcons["Central"];
      const maint = maintenanceCache[t.vehicleId];
      const condPct = maint ? maint.overallConditionPct : '–';
      const condCol = maint ? (condPct>=70?'#00e676':condPct>=55?'#ffab00':'#ff1744') : '#888';
      const svcStatus = maint ? maint.serviceStatus : '–';

      const popupHtml = `<div class="train-popup">
        <b>🚆 Train ${t.vehicleId}</b> <span style="color:${LINE_COLORS[t.lineName]||'#999'};font-weight:700">${t.lineName}</span><br>
        <b>Station:</b> ${t.stationName}<br>
        <b>Towards:</b> ${t.towards||'–'} · <b>Dir:</b> ${t.direction||'–'}<br>
        <b>ETA:</b> ${Math.floor(t.timeToStation/60)}m ${t.timeToStation%60}s<br>
        <hr style="border-color:#333;margin:4px 0">
        <span style="color:${condCol}">■</span> Condition: <b>${condPct}%</b> | Service: <b>${svcStatus}</b><br>
        <a href="#" onclick="showAsset('${t.vehicleId}');return false" style="color:#0098D4">View asset details →</a>
      </div>`;

      if (trainState[t.vehicleId]) {
        const st = trainState[t.vehicleId];
        st.targetLat = t.lat;
        st.targetLon = t.lon;
        st.data      = t;
        st.marker.setPopupContent(popupHtml);
      } else {
        const marker = L.marker([t.lat, t.lon], {icon})
          .bindPopup(popupHtml)
          .on('click', () => showAsset(t.vehicleId))
          .addTo(trainLayer);

        trainState[t.vehicleId] = {
          marker, currentLat:t.lat, currentLon:t.lon,
          targetLat:t.lat, targetLon:t.lon, data:t
        };
      }
    });

    document.getElementById('s-trains').textContent = data.count;
    document.getElementById('s-age').textContent    = data.fetchAge;
    document.getElementById('kql-age').textContent  = data.fetchAge;
    document.getElementById('status-text').textContent =
      `Live — ${data.count} trains — ${new Date(data.timestamp).toLocaleTimeString()}`;
  } catch(e) {
    document.getElementById('status-text').textContent = '⚠ Reconnecting...';
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// 60fps ANIMATION (smooth cubic ease-out, no page refresh)
// ══════════════════════════════════════════════════════════════════════════════
function animLoop() {
  const LERP = 0.06;
  Object.values(trainState).forEach(st => {
    const dx = st.targetLat - st.currentLat;
    const dy = st.targetLon - st.currentLon;
    if (Math.abs(dx) < 0.0000005 && Math.abs(dy) < 0.0000005) return;
    st.currentLat += dx * LERP;
    st.currentLon += dy * LERP;
    st.marker.setLatLng([st.currentLat, st.currentLon]);
  });
  requestAnimationFrame(animLoop);
}

// ── Layer Control ──
L.control.layers(null, {
  '🛤️ Tracks': trackLayers, '🚆 Trains': trainLayer, '⭕ Stations': stationLayer
}, {position:'bottomright',collapsed:false}).addTo(map);

// ══════════════════════════════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════════════════════════════
(async () => {
  await loadStatic();
  await loadFleetHealth();
  await refreshTrains();
  requestAnimationFrame(animLoop);
  setInterval(refreshTrains, POLL_MS);
  setInterval(loadFleetHealth, 60000);
})();
</script>
